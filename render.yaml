services:
  - type: web
    name: block-drop
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: block-drop-db
          property: connectionString
      # Set these manually in Render dashboard (keep secret):
      # JWT_SECRET, SCORE_SECRET, ADMIN_PASSWORD

databases:
  - name: block-drop-db
    plan: free
    databaseName: blockdrop
    user: blockdrop
